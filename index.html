<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Sarfean Practice Hub</title>

  <style>
    body {
      margin: 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fce7f3, #fef9c3);
      min-height: 100vh;
    }

    .main-container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 58px;
      color: #1d4ed8;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 24px;
      color: #444;
      margin-bottom: 45px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      padding: 35px 20px;
      border-radius: 22px;
      text-decoration: none;
      color: #111827;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
      border: 3px solid transparent;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: #2563eb;
      box-shadow: 0 14px 30px rgba(37,99,235,0.25);
    }

    .overall {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
    }
  </style>
</head>

<body>
  <div class="main-container">
    <h1>🌟 Welcome Bella Sarfean! 🌟</h1>

    <p class="subtitle">
      Built with love by Daddy ❤️<br>
      Choose your practice adventure and shine bright!
    </p>

    <div class="cards">
      <a href="all.html" class="card overall">Overall Practice</a>

      <a href="1-50.html" class="card">Questions 1–50</a>
      <a href="51-100.html" class="card">Questions 51–100</a>
      <a href="101-150.html" class="card">Questions 101–150</a>
      <a href="151-200.html" class="card">Questions 151–200</a>
      <a href="201-250.html" class="card">Questions 201–250</a>
      <a href="251-300.html" class="card">Questions 251–300</a>
      <a href="301-350.html" class="card">Questions 301–350</a>
      <a href="351-400.html" class="card">Questions 351–400</a>
      <a href="401-450.html" class="card">Questions 401–450</a>
      <a href="451-500.html" class="card">Questions 451–500</a>
    </div>
  </div>
</body>
</html>
