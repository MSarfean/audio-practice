<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Practice</title>

  <style>
    body {
      margin: 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeafe, #fce7f3, #fef9c3);
      padding: 30px;
    }

    .box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 28px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.18);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .back-button {
      display: inline-block;
      padding: 12px 22px;
      background: white;
      color: #2563eb;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      margin: 0;
    }

    h1 {
      color: #1d4ed8;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      color: #db2777;
      font-size: 28px;
      margin-top: 5px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    .counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .counter-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 12px;
      font-size: 18px;
      box-shadow: inset 0 0 0 2px #e5e7eb;
    }

    .counter-card strong {
      color: #2563eb;
      font-size: 24px;
    }

    #timer {
      margin: 0;
      width: fit-content;
      padding: 14px 24px;
      background: #fff7ed;
      color: #ea580c;
      font-size: 28px;
      font-weight: bold;
      border-radius: 18px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    }

    button {
      font-size: 19px;
      padding: 14px 22px;
      margin: 10px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
      box-shadow: 0 6px 14px rgba(37,99,235,0.25);
    }

    button:hover {
      background: #1d4ed8;
      transform: scale(1.04);
    }

    .correctButton {
      background: #16a34a;
    }

    .incorrectButton {
      background: #dc2626;
    }

    #questionName {
      margin-top: 18px;
      font-size: 17px;
      color: #555;
    }

    audio {
      margin-top: 15px;
      width: 100%;
    }

    #answer {
      margin-top: 22px;
      font-size: 30px;
      font-weight: bold;
      color: #111827;
      display: none;
      background: #ecfdf5;
      padding: 18px;
      border-radius: 16px;
    }

    #resultButtons {
      display: none;
      margin-top: 15px;
    }
    .pdf-button {
  display: inline-block;
  margin: 12px 10px;
  padding: 14px 22px;
  background: #7c3aed;
  color: white;
  text-decoration: none;
  font-size: 19px;
  font-weight: bold;
  border-radius: 16px;
  box-shadow: 0 6px 14px rgba(124,58,237,0.25);
}

.pdf-button:hover {
  background: #6d28d9;
  transform: scale(1.04);
}
  </style>
</head>

<body>
  <div class="box">

    <div class="top-bar">
      <a href="index.html" class="back-button">🏠 Home</a>
      <div id="timer">Time: 00:00</div>
    </div>

    <h1>IAC National Practice</h1>
    <h2>Good Luck Bella Sarfean! ❤️</h2>
    <p>Built with love by Daddy.</p>
    <p>Click the button to play a random question.</p>
    <a href="PDFs/Set%2011.pdf" target="_blank" class="pdf-button">📘 View Set 11 PDF</a>

    <div class="counters">
      <div class="counter-card">Remaining: <strong id="remainingCount">0</strong></div>
      <div class="counter-card">Correct: <strong id="correctCount">0</strong></div>
      <div class="counter-card">Incorrect: <strong id="incorrectCount">0</strong></div>
    </div>

    <button onclick="playRandomQuestion()">▶️ Play Random Question</button>
    <button onclick="showAnswer()">👀 Show Answer</button>

    <div id="questionName"></div>
    <audio id="audioPlayer" controls></audio>
    <div id="answer"></div>

    <div id="resultButtons">
      <button class="correctButton" onclick="markAnswer(true)">✅ Correct</button>
      <button class="incorrectButton" onclick="markAnswer(false)">❌ Incorrect</button>
    </div>

  </div>

  <script>
    const questions = [
{ audio: "audio/Q311.m4a", answer: "Malaria" },
{ audio: "audio/Q312.m4a", answer: "Distillation" },
{ audio: "audio/Q313.m4a", answer: "Photosphere" },
{ audio: "audio/Q314.m4a", answer: "Heat capacity" },
{ audio: "audio/Q315.m4a", answer: "Euclid" },
{ audio: "audio/Q316.m4a", answer: "Penicillin" },
{ audio: "audio/Q317.m4a", answer: "Perfect numbers" },
{ audio: "audio/Q318.m4a", answer: "pH" },
{ audio: "audio/Q319.m4a", answer: "Gregor Mendel" },
{ audio: "audio/Q320.m4a", answer: "Quarks" },
{ audio: "audio/Q321.m4a", answer: "George Washington Carver" },
{ audio: "audio/Q322.m4a", answer: "Algae" },
{ audio: "audio/Q323.m4a", answer: "Supernovae" },
{ audio: "audio/Q324.m4a", answer: "Granite" },
{ audio: "audio/Q325.m4a", answer: "X" },
{ audio: "audio/Q326.m4a", answer: "Bluetooth" },
{ audio: "audio/Q327.m4a", answer: "Sulfuric acid" },
{ audio: "audio/Q328.m4a", answer: "Antibiotics" },
{ audio: "audio/Q329.m4a", answer: "Ocean currents" },
{ audio: "audio/Q330.m4a", answer: "Volkswagen Beetle" },
{ audio: "audio/Q331.m4a", answer: "Discovery Channel" },
{ audio: "audio/Q332.m4a", answer: "Pluto" },
{ audio: "audio/Q333.m4a", answer: "Apollo 11" },
{ audio: "audio/Q334.m4a", answer: "First aid" },
{ audio: "audio/Q335.m4a", answer: "Polar bears" },
{ audio: "audio/Q336.m4a", answer: "Density" },
{ audio: "audio/Q337.m4a", answer: "Speed of sound" },
{ audio: "audio/Q338.m4a", answer: "Canidae" },
{ audio: "audio/Q339.m4a", answer: "Lightning" },
{ audio: "audio/Q340.m4a", answer: "Water" },
{ audio: "audio/Q341.m4a", answer: "Gravity" }
    ];

    let remainingQuestions = [...questions];
    let currentQuestion = null;
    let correctCount = 0;
    let incorrectCount = 0;
    let alreadyMarked = false;

    let seconds = 0;

    setInterval(function () {
      seconds++;

      let minutes = Math.floor(seconds / 60);
      let remainingSeconds = seconds % 60;

      document.getElementById("timer").textContent =
        "Time: " +
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");
    }, 1000);

    updateCounters();

    function playRandomQuestion() {
      if (remainingQuestions.length === 0) {
        document.getElementById("questionName").textContent = "🎉 All questions are finished!";
        document.getElementById("answer").style.display = "none";
        document.getElementById("resultButtons").style.display = "none";
        return;
      }

      const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
      currentQuestion = remainingQuestions[randomIndex];
      alreadyMarked = false;

      const audioPlayer = document.getElementById("audioPlayer");
      const answerDiv = document.getElementById("answer");
      const questionName = document.getElementById("questionName");
      const resultButtons = document.getElementById("resultButtons");

      audioPlayer.src = currentQuestion.audio;
      audioPlayer.play();

      answerDiv.style.display = "none";
      answerDiv.textContent = "";
      resultButtons.style.display = "none";
      questionName.textContent = "Now playing: " + currentQuestion.audio;
    }

    function showAnswer() {
      const answerDiv = document.getElementById("answer");
      const resultButtons = document.getElementById("resultButtons");

      if (!currentQuestion) {
        answerDiv.textContent = "Please play a question first.";
        resultButtons.style.display = "none";
      } else {
        answerDiv.textContent = "Answer: " + currentQuestion.answer;
        resultButtons.style.display = "block";
      }

      answerDiv.style.display = "block";
    }

    function markAnswer(isCorrect) {
      if (!currentQuestion || alreadyMarked) return;

      if (isCorrect) {
        correctCount++;
      } else {
        incorrectCount++;
      }

      remainingQuestions = remainingQuestions.filter(
        q => q.audio !== currentQuestion.audio
      );

      alreadyMarked = true;
      currentQuestion = null;

      document.getElementById("resultButtons").style.display = "none";
      document.getElementById("questionName").textContent =
        "Click Play Random Question for the next question.";

      updateCounters();
    }

    function updateCounters() {
      document.getElementById("remainingCount").textContent = remainingQuestions.length;
      document.getElementById("correctCount").textContent = correctCount;
      document.getElementById("incorrectCount").textContent = incorrectCount;
    }
  </script>
</body>
</html>
