    .top-bar {

      align-items: center;

    }

    .back-button {
      display: inline-block;
      padding: 12px 22px;
      background: white;
      color: #2563eb;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);

    }

    h1 {
      color: #1d4ed8;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      color: #db2777;
      font-size: 28px;
      margin-top: 5px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    .counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .counter-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 12px;
      font-size: 18px;
      box-shadow: inset 0 0 0 2px #e5e7eb;
    }

    .counter-card strong {
      color: #2563eb;
      font-size: 24px;
    }

    #timer {
      margin: 0;
      width: fit-content;
      padding: 14px 24px;
      background: #fff7ed;
      color: #ea580c;
      font-size: 28px;
      font-weight: bold;
      border-radius: 18px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    }

    button {
      font-size: 19px;
      padding: 14px 22px;
      margin: 10px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
      box-shadow: 0 6px 14px rgba(37,99,235,0.25);
    }

    button:hover {
      background: #1d4ed8;
      transform: scale(1.04);
    }

    .correctButton {
      background: #16a34a;
    }

    .incorrectButton {
      background: #dc2626;
    }

    #questionName {
      margin-top: 18px;
      font-size: 17px;
      color: #555;
    }

    audio {
      margin-top: 15px;
      width: 100%;
    }

    #answer {
      margin-top: 22px;
      font-size: 30px;
      font-weight: bold;
      color: #111827;
      display: none;
      background: #ecfdf5;
      padding: 18px;
      border-radius: 16px;
    }

    #resultButtons {
      display: none;
      margin-top: 15px;
    }
  </style>
</head>

    let alreadyMarked = false;

    let seconds = 0;

    setInterval(function () {
      seconds++;

      let minutes = Math.floor(seconds / 60);
      let remainingSeconds = seconds % 60;

      document.getElementById("timer").textContent =
        "Time: " +
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");
    }, 1000);

    updateCounters();

    function playRandomQuestion() {
      if (remainingQuestions.length === 0) {
        document.getElementById("questionName").textContent = "🎉 All questions are finished!";
        document.getElementById("answer").style.display = "none";
        document.getElementById("resultButtons").style.display = "none";
        return;
      }

      const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
      currentQuestion = remainingQuestions[randomIndex];
      alreadyMarked = false;

      const audioPlayer = document.getElementById("audioPlayer");
      const answerDiv = document.getElementById("answer");
      const questionName = document.getElementById("questionName");
      const resultButtons = document.getElementById("resultButtons");

      audioPlayer.src = currentQuestion.audio;
      audioPlayer.play();

      answerDiv.style.display = "none";
      answerDiv.textContent = "";
      resultButtons.style.display = "none";
      questionName.textContent = "Now playing: " + currentQuestion.audio;
    }

    function showAnswer() {
      const answerDiv = document.getElementById("answer");
      const resultButtons = document.getElementById("resultButtons");

      if (!currentQuestion) {
        answerDiv.textContent = "Please play a question first.";
        resultButtons.style.display = "none";
      } else {
        answerDiv.textContent = "Answer: " + currentQuestion.answer;
        resultButtons.style.display = "block";
      }

      answerDiv.style.display = "block";
    }

    function markAnswer(isCorrect) {
      if (!currentQuestion || alreadyMarked) return;

      if (isCorrect) {
        correctCount++;
      } else {
        incorrectCount++;
      }

      remainingQuestions = remainingQuestions.filter(
        q => q.audio !== currentQuestion.audio
      );

      alreadyMarked = true;
      currentQuestion = null;

      document.getElementById("resultButtons").style.display = "none";
      document.getElementById("questionName").textContent =
        "Click Play Random Question for the next question.";

      updateCounters();
    }

    function updateCounters() {
      document.getElementById("remainingCount").textContent = remainingQuestions.length;
      document.getElementById("correctCount").textContent = correctCount;
      document.getElementById("incorrectCount").textContent = incorrectCount;
    }
